<!doctype html>
<html>
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Task Manager</title><link rel="stylesheet" href="style.css"></head>
    <body>
        <main>
            <h1>Task Manager</h1>
            <form id="form">
                <input id="text" required placeholder="New task">
                <select id="priority">
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                </select>
                <button>Add</button>
            </form>
            <p>
                <button data-filter="all">All</button> 
                <button data-filter="active">Active</button> 
                <button data-filter="done">Done</button>
            </p>
            <ul id="list"></ul>
            <p id="count"></p>
        </main>
        <script src="app.js"></script>
    </body>
</html>
